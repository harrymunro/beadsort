[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beadsort"
version = "0.1.0"
description = "The intelligence layer for beads: typed, calibrated labels for your backlog"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["beads", "issue-tracker", "classification", "ai-agents", "cli", "backlog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "typesafe-sdk>=0.6.0",
]

[project.scripts]
beadsort = "beadsort.cli:main"

[project.urls]
Homepage = "https://github.com/harrymunro/beadsort"
Repository = "https://github.com/harrymunro/beadsort"
Issues = "https://github.com/harrymunro/beadsort/issues"
Changelog = "https://github.com/harrymunro/beadsort/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beadsort"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
