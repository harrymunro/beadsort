# Example .beadsort/config.yaml for a small products team tracked in beads.
# Copy to <repo>/.beadsort/config.yaml and edit. Never put an API key here.
# Every name below is fictional.
version: 1

owner: "Harry"

project:
  name: Acme
  summary: >-
    Internal tools for a products team: a proposal generator, an enquiry triage app and
    an order forecast, plus advisory notes, tracked in this repo.
  conventions: >-
    Descriptions carry a '## Friendly Summary' then '## Technical' section. Updates are
    dated; the newest update is the current truth and overrides the description.
  agent_names: [Notarius, Scriba, Consul, Censor, Clio, Thalia, Archimedes]

people:
  dana:   {name: "Dana Whitfield", aliases: [Dana],                   role: "programme sponsor"}
  priya:  {name: "Priya Nair",     aliases: ["Priya N", Priya],       role: "sales intelligence lead"}
  tomas:  {name: "Tomas",          aliases: [],                       role: "risk and compliance; enquiry app business owner"}
  lena:   {name: "Lena",           aliases: [],                       role: "CRM rules of use; proposal and forecast business owner"}
  sam:    {name: "Sam",            aliases: [],                       role: "head of IT"}

repos:
  proposals: "RFQ to priced proposal (pr- beads)"
  enquiries: "enquiry pack to opportunity brief (en- beads)"
  forecast: "order intake forecast (fc- beads)"

packs:
  - triage
  - size
  - id: agent-ready
    thresholds: {spec_ready: 1.5}

model: jev-latest
workers: 8

state:
  max_description_chars: 6000
  max_updates: 6
  max_update_chars: 1200
  parent_excerpt_chars: 600
  max_total_chars: 24000

select:
  statuses: [open, in_progress, blocked]
  types: []

on_uncertain: skip
audit: true
